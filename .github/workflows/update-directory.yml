name: Auto-Update Project Directory
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

jobs:
  update-readme:
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Issue and Append to README
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const getField = (label) => {
              const regex = new RegExp(`### ${label}\\s+([\\s\\S]*?)(?=\\n### |$)`);
              const m = body.match(regex);
              return m ? m[1].trim().replace(/\r?\n/g, ' ').replace(/\|/g, '/') : 'N/A';
            };
            const title = getField('Project / Guide Title');
            const url = getField('GitHub Repository URL');
            const stack = getField('Tech Stack / Language');
            const help = getField('What Help or Contributions Are You Looking For\\?');
            const owner = getField('Owner Name, Handle and Department / Batch');
            const row = `| ${title} | [Repo Link](${url}) | ${stack} | ${help} | ${owner} | Active |`;

            const fs = require('fs');
            let readme = fs.readFileSync('README.md', 'utf8');
            if (!readme.includes(url)) {
              readme = readme.replace('<!-- PROJECT_TABLE_END -->', `${row}\n<!-- PROJECT_TABLE_END -->`);
              fs.writeFileSync('README.md', readme);
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Approved and added **${title}** to the live README directory.`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: add approved student project to directory"
          git push
