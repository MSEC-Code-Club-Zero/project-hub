name: Sync Project Directory Table

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  sync-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild README table from unique project issues
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });

            function extractField(body, heading) {
              if (!body) return '';
              const regex = new RegExp(`###\\s+${heading}\\s*\\n+([\\s\\S]*?)(?=\\n###\\s+|$)`, 'i');
              const match = body.match(regex);
              return match ? match[1].trim() : '';
            }

            function cleanCell(text, maxLen = 140) {
              if (!text || text === '_No response_') return '—';
              let single = text.replace(/\r?\n+/g, ' ').replace(/\|/g, '\\|').trim();
              if (single.length > maxLen) {
                single = single.slice(0, maxLen - 3).trim() + '...';
              }
              return single;
            }

            const seenRepos = new Set();
            const rows = [];

            issues.sort((a, b) => a.number - b.number);

            for (const issue of issues) {
              if (issue.pull_request) continue;

              const repoUrlRaw = extractField(issue.body, 'GitHub Repository URL');
              const urlMatch = repoUrlRaw.match(/https?:\/\/github\.com\/[^\s)>\]]+/i);
              if (!urlMatch) continue;

              const normalizedUrl = urlMatch[0].replace(/\/+$/, '');
              const dedupeKey = normalizedUrl.toLowerCase();
              if (seenRepos.has(dedupeKey)) continue;
              seenRepos.add(dedupeKey);

              const title = cleanCell(extractField(issue.body, 'Project Title') || issue.title, 60);
              const stack = cleanCell(extractField(issue.body, 'Tech Stack'), 60);
              const help = cleanCell(extractField(issue.body, 'What Help Do You Need\\?'), 140);
              const ownerBatch = cleanCell(
                extractField(issue.body, 'Owner Name & Batch / Year') || `@${issue.user.login}`,
                60
              );

              rows.push(`| ${title} | [Repo Link](${normalizedUrl}) | ${stack} | ${help} | ${ownerBatch} | Open |`);
            }

            const readmePath = 'README.md';
            let readme = fs.readFileSync(readmePath, 'utf8');

            const startMarker = '<!-- PROJECT_TABLE_START -->';
            const endMarker = '<!-- PROJECT_TABLE_END -->';

            const startIndex = readme.indexOf(startMarker);
            const endIndex = readme.indexOf(endMarker);

            if (startIndex === -1 || endIndex === -1) {
              core.setFailed('Table markers not found in README.md');
              return;
            }

            const tableHeader = `| Project Title | Repository | Tech Stack | Help Needed | Owner and Batch | Status |\n| :--- | :--- | :--- | :--- | :--- | :--- |`;
            const dataRows = rows.length > 0
              ? rows.join('\n')
              : `| _No projects submitted yet_ | — | — | [Submit the first project](../../issues/new?template=1-submit-project.yml) | — | — |`;

            const tableBlock = `\n${tableHeader}\n${dataRows}\n`;

            const updatedReadme =
              readme.slice(0, startIndex + startMarker.length) +
              tableBlock +
              readme.slice(endIndex);

            if (updatedReadme !== readme) {
              fs.writeFileSync(readmePath, updatedReadme, 'utf8');
            }

      - name: Commit updated README.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync live community project directory"
            git push
          fi
